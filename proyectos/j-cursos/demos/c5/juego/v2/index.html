<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lluvia de fruta</title>
<style>
  :root { --acento: #0E9F8E; --naranja: #F08A24; --texto: #1F2A37; --suave: #5B6675; --fondo: #FFF8EE; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--fondo); color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px; }
  h1 { margin: 0; font-size: 1.8rem; color: var(--acento); }
  .cabecera { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .marcador { display: flex; gap: 10px; }
  .dato { background: #fff; border-radius: 12px; padding: 6px 14px; box-shadow: 0 2px 8px rgba(31,42,55,.08); font-weight: 600; }
  .dato b { color: var(--acento); font-size: 1.2rem; }
  #vidas { color: #E5484D; letter-spacing: 3px; font-size: 1.2rem; }
  .escena { position: relative; }
  canvas { display: block; width: 100%; aspect-ratio: 8 / 5; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(31, 42, 55, .15); }
  .panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; background: rgba(31, 42, 55, .55); border-radius: 16px; color: #fff; text-align: center; }
  .panel[hidden] { display: none; }
  .panel h2 { margin: 0; font-size: 2.2rem; }
  .panel p { margin: 0; font-size: 1.15rem; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer;
    background: var(--naranja); color: #fff; font-size: 1.1rem; }
  .ayuda { margin: 12px 0 0; color: var(--suave); font-size: .95rem; text-align: center; }
  kbd { background: #fff; border: 1px solid #d6dbe1; border-bottom-width: 3px; border-radius: 6px; padding: 1px 7px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="cabecera">
    <h1>Lluvia de fruta</h1>
    <div class="marcador">
      <span class="dato">Puntos <b id="puntos">0</b></span>
      <span class="dato" id="vidas">♥♥♥</span>
    </div>
  </div>
  <div class="escena">
    <canvas id="juego"></canvas>
    <div class="panel" id="panel" hidden>
      <h2>Fin de la partida</h2>
      <p>Has conseguido <strong id="final">0</strong> puntos</p>
      <button id="otra">Jugar otra vez</button>
    </div>
  </div>
  <p class="ayuda">Usa <kbd>←</kbd> y <kbd>→</kbd>. Atrapa la fruta y esquiva las piedras.</p>
</main>
<script>
const W = 800, H = 500;
const lienzo = document.getElementById('juego');
const ctx = lienzo.getContext('2d');
const dpr = window.devicePixelRatio || 1;
lienzo.width = W * dpr; lienzo.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

// Números aleatorios con semilla (para poder repetir una partida)
function azar(semilla) {
  return function () {
    semilla |= 0; semilla = semilla + 0x6D2B79F5 | 0;
    let t = Math.imul(semilla ^ semilla >>> 15, 1 | semilla);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rnd = azar(Date.now());

const cesta = { x: W / 2, y: H - 70, ancho: 110, alto: 46, velocidad: 420 };
let objetos = [], textos = [];
let espera = 0, puntos = 0, vidas = 3, estado = 'jugando';
const teclas = {};
const TIPOS = ['manzana', 'pera', 'cereza'];

function crearObjeto() {
  const piedra = rnd() < 0.25;
  const o = { x: 40 + rnd() * (W - 80), y: -20, r: piedra ? 22 : 20,
    tipo: piedra ? 'piedra' : TIPOS[Math.floor(rnd() * TIPOS.length)], velocidad: 160 + rnd() * 70 };
  if (piedra) o.forma = Array.from({ length: 8 }, () => 0.8 + rnd() * 0.3);
  objetos.push(o);
}

// ¿El objeto toca la boca de la cesta?
function tocaCesta(o) {
  return o.y + o.r >= cesta.y &&
         o.y - o.r <= cesta.y + cesta.alto &&
         Math.abs(o.x - cesta.x) <= cesta.ancho / 2 + o.r * 0.5;
}

// Texto que sube y se desvanece encima de la cesta
function flotar(x, t, color) {
  textos.push({ x, y: cesta.y - 20, t, color, vida: 1 });
}

function actualizar(dt, piloto) {
  if (estado !== 'jugando') return;
  let dir = 0;
  if (teclas.ArrowLeft) dir -= 1;
  if (teclas.ArrowRight) dir += 1;
  if (piloto) dir = piloto();
  cesta.x += dir * cesta.velocidad * dt;
  cesta.x = Math.max(cesta.ancho / 2, Math.min(W - cesta.ancho / 2, cesta.x));

  espera -= dt;
  if (espera <= 0) { crearObjeto(); espera = 0.8; }
  for (const o of objetos) {
    o.y += o.velocidad * dt;
    if (!o.fuera && tocaCesta(o)) {
      o.fuera = true;
      if (o.tipo === 'piedra') {
        vidas--;
        flotar(o.x, '−1 vida', '#C81E3A');
      } else {
        puntos++;
        flotar(o.x, '+1', '#0E7C6F');
      }
    }
  }
  objetos = objetos.filter(o => !o.fuera && o.y < H + 40);
  for (const t of textos) { t.y -= 40 * dt; t.vida -= dt; }
  textos = textos.filter(t => t.vida > 0);
  pintarMarcador();
  if (vidas <= 0) terminar();
}

function pintarMarcador() {
  document.getElementById('puntos').textContent = puntos;
  document.getElementById('vidas').textContent = '♥'.repeat(Math.max(0, vidas)) + '♡'.repeat(3 - Math.max(0, vidas));
}

function terminar() {
  estado = 'fin';
  document.getElementById('final').textContent = puntos;
  document.getElementById('panel').hidden = false;
  document.getElementById('otra').focus();
}

function empezar() {
  objetos = []; textos = []; espera = 0; puntos = 0; vidas = 3; cesta.x = W / 2;
  estado = 'jugando';
  document.getElementById('panel').hidden = true;
  pintarMarcador();
}

// ---------- Dibujo ----------
const fondo = document.createElement('canvas');
fondo.width = W * dpr; fondo.height = H * dpr;
(function pintarFondo() {
  const c = fondo.getContext('2d'); c.scale(dpr, dpr);
  const cielo = c.createLinearGradient(0, 0, 0, H);
  cielo.addColorStop(0, '#BFE7F7'); cielo.addColorStop(1, '#F1FAFD');
  c.fillStyle = cielo; c.fillRect(0, 0, W, H);
  c.fillStyle = '#FFE08A'; c.beginPath(); c.arc(680, 120, 40, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#A8D8A0'; c.beginPath(); c.ellipse(200, H - 30, 380, 120, 0, Math.PI, 0); c.fill();
  c.fillStyle = '#8CC983'; c.beginPath(); c.ellipse(640, H - 25, 360, 100, 0, Math.PI, 0); c.fill();
  c.fillStyle = '#6BA35A'; c.fillRect(0, H - 32, W, 32);
  for (let x = -20; x < W + 40; x += 46) {
    c.fillStyle = (x / 46) % 2 ? '#3E8E4E' : '#4FA35E';
    c.beginPath(); c.arc(x, 4 + (x % 3) * 6, 42, 0, Math.PI * 2); c.fill();
  }
})();

function dibujarObjeto(o) {
  ctx.save(); ctx.translate(o.x, o.y);
  if (o.tipo === 'piedra') {
    ctx.fillStyle = '#868C96'; ctx.strokeStyle = '#4B515A'; ctx.lineWidth = 3;
    ctx.beginPath();
    o.forma.forEach((k, i) => {
      const a = i / o.forma.length * Math.PI * 2;
      ctx.lineTo(Math.cos(a) * o.r * k, Math.sin(a) * o.r * k * 0.85);
    });
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6B717B';
    ctx.beginPath(); ctx.arc(-6, 3, 3, 0, Math.PI * 2); ctx.arc(7, -4, 2.5, 0, Math.PI * 2); ctx.fill();
  } else if (o.tipo === 'cereza') {
    ctx.strokeStyle = '#5B7A2E'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-8, 4); ctx.quadraticCurveTo(-4, -16, 4, -20);
    ctx.moveTo(9, 6); ctx.quadraticCurveTo(8, -12, 4, -20); ctx.stroke();
    ctx.fillStyle = '#C81E3A';
    ctx.beginPath(); ctx.arc(-8, 8, 10, 0, Math.PI * 2); ctx.arc(9, 10, 10, 0, Math.PI * 2); ctx.fill();
  } else if (o.tipo === 'pera') {
    ctx.fillStyle = '#C9D84A';
    ctx.beginPath(); ctx.arc(0, 6, 17, 0, Math.PI * 2); ctx.arc(0, -8, 11, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#6B4A2B'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(3, -26); ctx.stroke();
  } else {
    ctx.fillStyle = '#E5484D';
    ctx.beginPath(); ctx.arc(-6, 0, 15, 0, Math.PI * 2); ctx.arc(6, 0, 15, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#6B4A2B'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(2, -22); ctx.stroke();
    ctx.fillStyle = '#4FA35E';
    ctx.beginPath(); ctx.ellipse(9, -18, 8, 4, -0.5, 0, Math.PI * 2); ctx.fill();
  }
  if (o.tipo !== 'piedra') {
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.beginPath(); ctx.ellipse(-7, -3, 4, 6, 0.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function dibujarCesta() {
  const { x, y, ancho, alto } = cesta;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(0,0,0,.15)';
  ctx.beginPath(); ctx.ellipse(0, alto + 6, ancho / 2, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#C48A47';
  ctx.beginPath();
  ctx.moveTo(-ancho / 2, 0); ctx.lineTo(ancho / 2, 0);
  ctx.lineTo(ancho / 2 - 12, alto); ctx.lineTo(-ancho / 2 + 12, alto); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#9A6430'; ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(-ancho / 2 + 3 * i, alto * i / 4); ctx.lineTo(ancho / 2 - 3 * i, alto * i / 4); ctx.stroke();
  }
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath(); ctx.moveTo(i * 15, 0); ctx.lineTo(i * 12, alto); ctx.stroke();
  }
  ctx.fillStyle = '#8C5527'; ctx.fillRect(-ancho / 2 - 4, -6, ancho + 8, 10);
  ctx.restore();
}

function dibujar() {
  ctx.drawImage(fondo, 0, 0, W, H);
  objetos.forEach(dibujarObjeto);
  dibujarCesta();
  ctx.font = '700 24px system-ui, sans-serif'; ctx.textAlign = 'center';
  for (const t of textos) {
    ctx.globalAlpha = Math.max(0, t.vida); ctx.fillStyle = t.color; ctx.fillText(t.t, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

// ---------- Bucle ----------
const PASO = 1 / 60;
let antes = performance.now(), acumulado = 0, congelado = false;
function bucle(ahora) {
  acumulado += Math.min(0.1, (ahora - antes) / 1000); antes = ahora;
  while (acumulado >= PASO) { if (!congelado) actualizar(PASO); acumulado -= PASO; }
  dibujar();
  requestAnimationFrame(bucle);
}
requestAnimationFrame(bucle);

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { teclas[e.key] = true; e.preventDefault(); }
  if (e.key === ' ' && estado === 'fin') { e.preventDefault(); empezar(); }
});
window.addEventListener('keyup', e => { teclas[e.key] = false; });
document.getElementById('otra').addEventListener('click', empezar);

// Modo demostración: avanza la partida con una semilla fija y la deja quieta
function piloto() {
  const cerca = objetos.filter(o => o.y < cesta.y + 10).sort((a, b) => b.y - a.y);
  const piedra = cerca.find(o => o.tipo === 'piedra' && o.y > cesta.y - 160 && Math.abs(o.x - cesta.x) < cesta.ancho);
  if (piedra) return piedra.x > cesta.x ? -1 : 1;
  const f = cerca.find(o => o.tipo !== 'piedra');
  if (!f || Math.abs(f.x - cesta.x) < 10) return 0;
  return Math.sign(f.x - cesta.x) * 0.8;
}
window.__demo = function (segundos = 15, semilla = 7) {
  rnd = azar(semilla); empezar();
  for (let i = 0; i < segundos * 60 && estado === 'jugando'; i++) actualizar(PASO, piloto);
  congelado = estado === 'jugando'; dibujar();
  return { puntos, vidas, estado };
};
</script>
</body>
</html>
