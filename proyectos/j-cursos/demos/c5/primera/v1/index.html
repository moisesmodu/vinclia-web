<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dividir la cuenta</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .caja {
    background: white;
    padding: 24px 32px;
    border-radius: 8px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
  }
  label { display: block; margin-top: 14px; }
  input {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    font-size: 16px;
    box-sizing: border-box;
  }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    font-size: 16px;
    background: #4a7bd0;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  #resultado { margin-top: 20px; font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
  <div class="caja">
    <h1>Dividir la cuenta</h1>

    <label for="total">Total de la cuenta (€)</label>
    <input type="number" id="total" placeholder="Ej: 86.40">

    <label for="propina">Propina (%)</label>
    <input type="number" id="propina" value="10">

    <label for="personas">Número de personas</label>
    <input type="number" id="personas" value="2">

    <button id="calcular" onclick="calcular()">Calcular</button>

    <p id="resultado"></p>
  </div>

<script>
  function calcular() {
    const total = parseFloat(document.getElementById("total").value);
    const propina = parseFloat(document.getElementById("propina").value);
    const personas = parseInt(document.getElementById("personas").value);

    const totalConPropina = total + total * propina / 100;
    const porPersona = totalConPropina / personas;

    document.getElementById("resultado").textContent =
      "Cada uno paga: " + porPersona.toFixed(2) + " €";
  }
</script>
</body>
</html>
