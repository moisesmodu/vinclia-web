<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presupuestos · Reformas Jordi</title>
<style>
  :root {
    --acento: #C8552B;
    --acento-osc: #A3431F;
    --acento-suave: #FBEDE6;
    --texto: #1F2633;
    --gris: #6A7280;
    --linea: #E5E0D8;
    --fondo: #F5F2ED;
    --blanco: #FFFFFF;
    --error: #C62828;
    --ok: #2E7D4F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    line-height: 1.45;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .barra-sup {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 28px; background: var(--texto); color: #fff;
  }
  .logo {
    width: 38px; height: 38px; border-radius: 10px; background: var(--acento);
    display: grid; place-items: center; font-weight: 800; letter-spacing: -.5px;
  }
  .barra-sup h1 { font-size: 19px; margin: 0; font-weight: 700; }
  .barra-sup .etiqueta {
    font-size: 13px; padding: 3px 10px; border-radius: 99px;
    background: rgba(255,255,255,.12); color: #F3D9CD;
  }
  .barra-sup .hueco { flex: 1; }

  main {
    max-width: 1380px; margin: 0 auto; padding: 24px 28px 48px;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 400px); gap: 24px; align-items: start;
  }
  .tarjeta {
    background: var(--blanco); border-radius: 16px; padding: 18px 20px;
    box-shadow: 0 1px 3px rgba(31,38,51,.08); margin-bottom: 18px;
  }
  .tarjeta h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .tarjeta h2 .n {
    width: 24px; height: 24px; border-radius: 50%; background: var(--acento-suave); color: var(--acento-osc);
    display: grid; place-items: center; font-size: 13px;
  }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--gris); }
  input, select {
    width: 100%; margin-top: 4px; padding: 9px 11px; border: 1.5px solid var(--linea);
    border-radius: 10px; background: var(--blanco); font-size: 15px;
  }
  input:focus, select:focus { outline: none; border-color: var(--acento); }
  .rejilla { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .rejilla .ancho { grid-column: 1 / -1; }

  .lineas { width: 100%; border-collapse: collapse; }
  .lineas th {
    text-align: left; font-size: 12px; font-weight: 700; color: var(--gris);
    text-transform: uppercase; letter-spacing: .04em; padding: 0 6px 6px;
  }
  .lineas td { padding: 4px 6px; vertical-align: top; }
  .lineas td input { margin-top: 0; }
  .lineas .num { text-align: right; }
  .lineas td.importe { padding-top: 13px; text-align: right; font-weight: 600; white-space: nowrap; }
  .col-cant { width: 92px; } .col-precio { width: 112px; } .col-imp { width: 110px; } .col-x { width: 36px; }
  .borrar {
    border: 0; background: none; color: var(--gris); font-size: 20px; line-height: 1;
    width: 32px; height: 38px; border-radius: 8px;
  }
  .borrar:hover { background: var(--acento-suave); color: var(--acento-osc); }

  .btn {
    border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: 15px;
    background: var(--acento); color: #fff;
  }
  .btn:hover { background: var(--acento-osc); }
  .btn.sec { background: var(--acento-suave); color: var(--acento-osc); }
  .btn.sec:hover { background: #F6DCCF; }
  .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .nota { font-size: 13px; color: var(--gris); margin: 6px 0 0; }

  /* Resumen con los totales */
  .lado { position: sticky; top: 20px; }
  .resumen div { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--linea); }
  .resumen .gran { border: 0; border-top: 2px solid var(--texto); margin-top: 6px; padding-top: 12px; font-size: 24px; font-weight: 800; }
  .resumen .gran span:last-child { color: var(--acento-osc); }


  @media screen and (max-width: 900px) {
    main { grid-template-columns: 1fr; padding: 16px; }
    .lado { position: static; }
    .barra-sup { padding: 12px 16px; }
    .barra-sup .etiqueta { display: none; }
    .barra-sup h1 { font-size: 17px; }
    .lineas .col-cant, .lineas .col-precio { width: auto; }
    .rejilla { grid-template-columns: 1fr; }
    .lineas thead { display: none; }
    .lineas tr { display: grid; grid-template-columns: 1fr 1fr 36px; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--linea); }
    .lineas td { padding: 0; }
    .lineas td:first-child { grid-column: 1 / -1; }
    .lineas td.importe { grid-column: 1 / 3; text-align: left; padding: 0; }
    .lineas td.col-x { grid-row: 2; grid-column: 3; }
  }
</style>
</head>
<body>

<header class="barra-sup">
  <div class="logo">RJ</div>
  <h1>Reformas Jordi</h1>
  <span class="etiqueta">Presupuestos</span>
</header>

<main>
  <section class="editor">
    <div class="tarjeta">
      <h2><span class="n">1</span> Líneas del presupuesto</h2>
      <table class="lineas">
        <thead>
          <tr>
            <th>Concepto</th><th class="num">Cantidad</th><th class="num">Precio (€)</th>
            <th class="num">Importe</th><th></th>
          </tr>
        </thead>
        <tbody id="filas"></tbody>
      </table>
      <div class="acciones"><button class="btn sec" id="add">+ Añadir línea</button></div>
    </div>

  </section>

  <aside class="lado">
    <div class="tarjeta resumen">
      <h2>Resumen</h2>
      <div class="gran"><span>Total</span><span id="t-total"></span></div>
    </div>
  </aside>
</main>


<script>
const euros = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });
const $ = s => document.querySelector(s);

function nuevaFila(concepto = '', cantidad = '', precio = '') {
  const tr = document.createElement('tr');
  tr.className = 'linea';
  tr.innerHTML = `
    <td><input class="concepto" placeholder="Ej.: Alicatado de baño (m²)"></td>
    <td class="col-cant"><input class="cantidad num" inputmode="decimal" placeholder="Cant."></td>
    <td class="col-precio"><input class="precio num" inputmode="decimal" placeholder="Precio €"></td>
    <td class="importe col-imp">–</td>
    <td class="col-x"><button class="borrar" title="Quitar línea">×</button></td>`;
  tr.querySelector('.concepto').value = concepto;
  tr.querySelector('.cantidad').value = cantidad;
  tr.querySelector('.precio').value = precio;
  tr.querySelector('.borrar').onclick = () => { tr.remove(); calcularTotal(); };
  $('#filas').append(tr);
  return tr;
}

// Acepta la coma decimal: "12,5" → 12.5
function numero(texto) {
  return parseFloat(texto.replace(',', '.')) || 0;
}

function calcularTotal() {
  let total = 0;
  for (const fila of document.querySelectorAll('.linea')) {
    const campo = c => fila.querySelector(c);
    const cantidad = numero(campo('.cantidad').value);
    const precio = numero(campo('.precio').value);
    const importe = cantidad * precio;
    campo('.importe').textContent = euros.format(importe);
    total += importe;
  }
  $('#t-total').textContent = euros.format(total);
}

document.querySelector('.editor').addEventListener('input', calcularTotal);
$('#add').onclick = () => { nuevaFila().querySelector('.concepto').focus(); };

[
  ['Alicatado de baño (m²)', '12,5', '32'],
  ['Plato de ducha de resina', '1', '289,90'],
  ['Retirada de escombros', '1', '150']
].forEach(l => nuevaFila(...l));
calcularTotal();
</script>
</body>
</html>
