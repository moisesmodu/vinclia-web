  company: "Plaça"
  role: "Fundador"
  email: "moises@oposita.digital"        # el buzón real que envía y recibe (Workspace o SMTP+IMAP)
  linkedin: ""
  tone: "directo, sereno, honesto; tutea; habla de la oposición concreta por su nombre; sin frases de vendedor"

product:
  name: "Plaça"
  description: "Tests de oposiciones catalanas (Mossos d'Esquadra, Bombers de la Generalitat, TCAI del ICS, auxiliar administratiu de la Generalitat y ajuntaments) con el artículo exacto de la ley en cada respuesta, simulacros con el formato real de cada convocatoria y repaso espaciado. Hecho en Lleida. En catalán y castellano."
  pricing: "Particulares: 9,99 €/mes, 23,97 € trimestral, 71,88 € anual. Academias: licencia de grupo a 4 €/alumno y mes (mínimo 10 alumnos) con panel del profesorado."
  key_benefits:
    - "Cada pregunta enlaza al artículo del BOE o del DOGC: el alumno ve de dónde sale la respuesta"
    - "Simulacros con el formato real: 30 preguntas en 35 minutos y −1/4 en Mossos, 70 en Bombers"
    - "Repaso espaciado: la app vuelve a preguntar lo que falla justo antes de que se olvide"
    - "Convocatorias 2027 de Cataluña actualizadas cada semana (35 procesos)"
    - "El historial del alumno no se borra al cancelar"
  objection_responses:
    "ya usamos otra app de tests": "Tiene sentido. ¿Qué os falta en la que usáis: la ley en cada respuesta, las oposiciones catalanas concretas o el panel para el profesorado?"
    "es caro": "Son 4 € por alumno y mes, y el primer mes es gratis para todo el grupo. Si no os ahorra horas de preparar tests, no seguís."
    "no tenemos tiempo": "No hace falta reunión. Os mando un código, los alumnos entran con él y en una semana me decís qué tal."
    "las preguntas no son oficiales": "Son generadas a partir de la normativa vigente y verificadas contra el texto legal; cada una enlaza al artículo. Y cada pregunta tiene un botón para avisar de un error, que corregimos el mismo día."
  offer:
    primary: "Licencia de grupo: 4 €/alumno y mes, mínimo 10 alumnos, con panel del profesorado y todas las oposiciones"
    entry: "30 días gratis para todos los alumnos de la academia con un código propio, sin tarjeta"
    goal: "start_trial"
    booking_method: "ask_preference"
    booking_url: ""
    meeting_duration: "10 minutos"
    meeting_owner: "Moisés Mora"

